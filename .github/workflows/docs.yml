name: docs

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select docs channel
        id: docs
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            master)
              echo "version=stable" >> "$GITHUB_OUTPUT"
              echo "title=Stable" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "version=nightly" >> "$GITHUB_OUTPUT"
              echo "title=Nightly" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported documentation branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Render PlantUML diagrams
        shell: bash
        run: |
          mapfile -t diagrams < <(find docs -type f -name '*.puml')
          if [ "${#diagrams[@]}" -eq 0 ]; then
            echo "No PlantUML files found under docs/"
            exit 0
          fi

          plantuml -tpng "${diagrams[@]}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate docs
        run: mkdocs build --strict --site-dir /tmp/romm-vita-sync-docs-strict

      - name: Fetch docs deployment branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
          fi

      - name: Deploy versioned docs
        run: mike deploy --push --update-aliases --title "${{ steps.docs.outputs.title }}" "${{ steps.docs.outputs.version }}"

      - name: Select default docs channel
        shell: bash
        run: |
          if [ "${{ steps.docs.outputs.version }}" = "stable" ]; then
            mike set-default --push stable
          elif git show origin/gh-pages:versions.json 2>/dev/null | grep -q '"version": "stable"'; then
            mike set-default --push stable
          else
            mike set-default --push nightly
          fi
